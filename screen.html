<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vanya 挂机面板</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0d1117; color:#c9d7e4;
         font:14px/1.5 -apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif; }
  #v { width:100%; display:block; background:#000; cursor:pointer; }
  .bar { position:sticky; top:0; background:#161b22; padding:8px 10px;
         border-bottom:1px solid #2a3441; display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#22364a; color:#d6e6f2; border:1px solid #33506b;
           border-radius:6px; padding:7px 11px; font:inherit; cursor:pointer; }
  button:active { background:#2d4762; }
  input { background:#0d1117; color:#c9d7e4; border:1px solid #33506b;
          border-radius:6px; padding:7px 9px; font:inherit; width:110px; }
  .sec { padding:10px; border-bottom:1px solid #2a3441; }
  .sec h3 { margin:0 0 6px; font-size:13px; color:#8fd6ff; font-weight:600; }
  pre { margin:0; background:#0d1117; border:1px solid #2a3441; border-radius:6px;
        padding:8px; max-height:230px; overflow:auto; font-size:12px;
        white-space:pre-wrap; word-break:break-all; color:#9fb6c9; }
  .muted { color:#6b8299; font-size:12px; }
  #st { color:#7ee787; }
</style>
</head>
<body>

<div class="bar">
  <button onclick="run('VANYA.tick()','out')">立即执行</button>
  <button onclick="run('VANYA.scan()','out')">诊断</button>
  <button onclick="run('VANYA.claimChest()','out')">领宝箱</button>
  <button onclick="run('VANYA.state()','out')">状态</button>
  <button onclick="run('VANYA.logTail(20)','out')">日志</button>
</div>

<img id="v" src="/stream.mjpg" alt="画面加载中…">

<div class="sec">
  <h3>运行状态</h3>
  <div id="st">加载中…</div>
</div>

<div class="sec">
  <h3>账号登录（只进浏览器内存，不落盘）</h3>
  <input id="u" placeholder="账号" autocomplete="off">
  <input id="p" type="password" placeholder="密码">
  <button onclick="login()">写入并登录</button>
  <div class="muted">也可直接点上方画面自己登录；凭据仅存在容器浏览器 localStorage。</div>
</div>

<div class="sec">
  <h3>参数</h3>
  血线% <input id="gp" type="number" value="35" style="width:70px">
  巡检秒 <input id="tm" type="number" value="15" style="width:70px">
  <button onclick="cfg()">应用</button>
  <button onclick="run('location.href=\'/actions/explore\'','out')">去狩猎</button>
</div>

<div class="sec">
  <h3>输出</h3>
  <pre id="out">（点上面的按钮）</pre>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function run(code, target) {
  try {
    const r = await fetch('/api/exec?c=' + encodeURIComponent(code));
    const j = await r.json();
    if (target) $(target).textContent = j.result;
    return j.result;
  } catch (e) { if (target) $(target).textContent = '请求失败: ' + e; }
}

async function login() {
  const u = $('u').value, p = $('p').value;
  if (!u || !p) { $('out').textContent = '请填账号和密码'; return; }
  const out = $('out');
  out.textContent = '1/3 写入凭据…';
  out.textContent = await run('VANYA.setCred(' + JSON.stringify(u) + ',' + JSON.stringify(p) + ')');
  out.textContent += '\n2/3 触发登录（页面跳转属正常，请看画面）…';
  out.textContent += '\n3/3 ' + await run('VANYA.tick()');
  out.textContent += '\n完成。若画面已变成游戏界面即登录成功。';
}

// 画面降级：MJPEG 断流/不支持时自动切单帧轮询
let pollT = null, mjpegFailed = false;
$('v').addEventListener('error', () => {
  if (mjpegFailed) return;
  mjpegFailed = true;
  $('v').src = '/shot.jpg';
  pollT = setInterval(() => { $('v').src = '/shot.jpg?t=' + Date.now(); }, 500);
  $('st').textContent = '（MJPEG 不可用，已切换单帧轮询模式）';
});

async function cfg() {
  const gp = Number($('gp').value), tm = Number($('tm').value);
  $('out').textContent = await run('VANYA.cfg({guardPct:' + gp + ',tickMs:' + (tm * 1000) + '})');
}

// 点画面 = 在容器浏览器里点同一位置
$('v').addEventListener('click', function (e) {
  const r = this.getBoundingClientRect();
  fetch('/api/click?x=' + ((e.clientX - r.left) / r.width) + '&y=' + ((e.clientY - r.top) / r.height));
});

async function status() {
  const s = await run('VANYA.state()');
  const pg = await run('VANYA.page()');
  const hp = await run('JSON.stringify(VANYA.readHP())');
  $('st').textContent = '页面: ' + pg + ' | HP: ' + hp + ' | state: ' + s;
}
status();
setInterval(status, 5000);
</script>
</body>
</html>
